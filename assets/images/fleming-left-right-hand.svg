<svg xmlns="http://www.w3.org/2000/svg" width="700" height="374" viewBox="0 0 700 374" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, Meiryo, Helvetica, Arial, sans-serif" role="img" aria-label="フレミングの左手の法則と右手の法則を並べた図。左は左手＝モーターで、親指が上を向いて力 F、人差し指が右を向いて磁束密度 B、中指が手前へ向いて電流 I を表し、式は F = BIL sinθ、θ は導体を流れる電流 I と磁束密度 B のなす角。右は右手＝発電機で、親指が上を向いて導体の移動速度 v、人差し指が左を向いて磁束密度 B、中指が手前へ向いて起電力 e を表し、式は e = BLv sinθ、θ は速度 v と磁束密度 B のなす角。両パネルの外側に、磁界の中へ斜めに置かれた長さ L の導体があり、左は電流 I と磁界 B、右は速度 v と磁界 B のなす角に θ が付いている">
  <defs>
    <marker id="flem-ok" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#346b49" />
    </marker>
    <marker id="flem-ink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#151b24" />
    </marker>
    <marker id="flem-danger" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 z" fill="#9c433f" />
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="374" rx="10" fill="#fefdfb" />

  <line x1="350" y1="14" x2="350" y2="360" stroke="#d4d8dd" stroke-width="1" stroke-dasharray="5 5" />

  <text x="176" y="26" text-anchor="middle" font-size="14.5" font-weight="700" fill="#151b24">左手 ＝ モーター</text>
  <text x="176" y="45" text-anchor="middle" font-size="11" fill="#5f646b">電流を与えて力を得る（電気 → 運動）</text>
  <text x="176" y="74" text-anchor="middle" font-size="16.5" font-weight="700" fill="#151b24">F = BIL sinθ ［N］</text>

  <line x1="44" y1="116" x2="104" y2="196" stroke="#5f646b" stroke-width="9" stroke-linecap="round" />
  <text x="28" y="138" font-size="11.5" font-weight="700" fill="#5f646b">L</text>
  <line x1="40" y1="156" x2="122" y2="156" stroke="#151b24" stroke-width="2.4" marker-end="url(#flem-ink)" />
  <text x="128" y="152" font-size="12.5" font-weight="700" fill="#151b24">B</text>
  <line x1="74" y1="156" x2="106" y2="199" stroke="#9c433f" stroke-width="2.4" marker-end="url(#flem-danger)" />
  <text x="110" y="209" font-size="12.5" font-weight="700" fill="#9c433f">I</text>
  <path d="M 94 156 A 20 20 0 0 1 86 172" fill="none" stroke="#474d57" stroke-width="1.6" />
  <text x="97" y="180" font-size="12.5" fill="#474d57">θ</text>
  <text x="74" y="228" text-anchor="middle" font-size="10.5" fill="#5f646b">長さ L の導体</text>
  <text x="74" y="245" text-anchor="middle" font-size="10.5" fill="#5f646b">θ は I と B のなす角</text>

  <g opacity="0.3">
    <ellipse cx="206" cy="216" rx="42" ry="33" fill="#90502a" />
    <line x1="182" y1="192" x2="182" y2="142" stroke="#90502a" stroke-width="18" stroke-linecap="round" />
    <line x1="212" y1="192" x2="288" y2="192" stroke="#90502a" stroke-width="19" stroke-linecap="round" />
    <line x1="214" y1="236" x2="254" y2="280" stroke="#90502a" stroke-width="18" stroke-linecap="round" />
  </g>
  <g fill="none" stroke="#90502a" stroke-width="1.6" opacity="0.5">
    <path d="M 176 214 Q 196 206 214 216" />
    <path d="M 174 228 Q 194 220 212 230" />
    <path d="M 176 241 Q 194 234 210 243" />
  </g>

  <line x1="182" y1="200" x2="182" y2="126" stroke="#346b49" stroke-width="2.6" marker-end="url(#flem-ok)" />
  <text x="182" y="100" text-anchor="middle" font-size="10.5" fill="#5f646b">親指</text>
  <text x="182" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#346b49">F（力）</text>

  <line x1="212" y1="192" x2="300" y2="192" stroke="#151b24" stroke-width="2.6" marker-end="url(#flem-ink)" />
  <text x="300" y="162" text-anchor="end" font-size="10.5" fill="#5f646b">人差し指</text>
  <text x="300" y="178" text-anchor="end" font-size="12.5" font-weight="700" fill="#151b24">B（磁界）</text>

  <line x1="214" y1="240" x2="262" y2="292" stroke="#9c433f" stroke-width="2.6" marker-end="url(#flem-danger)" />
  <text x="272" y="290" font-size="10.5" fill="#5f646b">中指</text>
  <text x="272" y="306" font-size="12.5" font-weight="700" fill="#9c433f">I（電流）</text>
  <text x="272" y="322" font-size="10" fill="#5f646b">紙面の手前へ</text>

  <text x="176" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#151b24">フレミングの左手の法則</text>

  <text x="524" y="26" text-anchor="middle" font-size="14.5" font-weight="700" fill="#151b24">右手 ＝ 発電機</text>
  <text x="524" y="45" text-anchor="middle" font-size="11" fill="#5f646b">動かして起電力を得る（運動 → 電気）</text>
  <text x="524" y="74" text-anchor="middle" font-size="16.5" font-weight="700" fill="#151b24">e = BLv sinθ ［V］</text>

  <line x1="600" y1="116" x2="660" y2="196" stroke="#5f646b" stroke-width="9" stroke-linecap="round" />
  <text x="584" y="138" font-size="11.5" font-weight="700" fill="#5f646b">L</text>
  <line x1="596" y1="156" x2="678" y2="156" stroke="#151b24" stroke-width="2.4" marker-end="url(#flem-ink)" />
  <text x="684" y="152" font-size="12.5" font-weight="700" fill="#151b24">B</text>
  <line x1="630" y1="156" x2="648" y2="106" stroke="#346b49" stroke-width="2.4" marker-end="url(#flem-ok)" />
  <text x="654" y="104" font-size="12.5" font-weight="700" fill="#346b49">v</text>
  <path d="M 650 156 A 20 20 0 0 0 636.8 137.2" fill="none" stroke="#474d57" stroke-width="1.6" />
  <text x="656" y="136" font-size="12.5" fill="#474d57">θ</text>
  <text x="630" y="228" text-anchor="middle" font-size="10.5" fill="#5f646b">長さ L の導体</text>
  <text x="630" y="245" text-anchor="middle" font-size="10.5" fill="#5f646b">θ は v と B のなす角</text>

  <g opacity="0.3">
    <ellipse cx="494" cy="216" rx="42" ry="33" fill="#90502a" />
    <line x1="518" y1="192" x2="518" y2="142" stroke="#90502a" stroke-width="18" stroke-linecap="round" />
    <line x1="488" y1="192" x2="412" y2="192" stroke="#90502a" stroke-width="19" stroke-linecap="round" />
    <line x1="486" y1="236" x2="446" y2="280" stroke="#90502a" stroke-width="18" stroke-linecap="round" />
  </g>
  <g fill="none" stroke="#90502a" stroke-width="1.6" opacity="0.5">
    <path d="M 524 214 Q 504 206 486 216" />
    <path d="M 526 228 Q 506 220 488 230" />
    <path d="M 524 241 Q 506 234 490 243" />
  </g>

  <line x1="518" y1="200" x2="518" y2="126" stroke="#346b49" stroke-width="2.6" marker-end="url(#flem-ok)" />
  <text x="518" y="100" text-anchor="middle" font-size="10.5" fill="#5f646b">親指</text>
  <text x="518" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#346b49">v（速度）</text>

  <line x1="488" y1="192" x2="400" y2="192" stroke="#151b24" stroke-width="2.6" marker-end="url(#flem-ink)" />
  <text x="400" y="162" font-size="10.5" fill="#5f646b">人差し指</text>
  <text x="400" y="178" font-size="12.5" font-weight="700" fill="#151b24">B（磁界）</text>

  <line x1="486" y1="240" x2="438" y2="292" stroke="#9c433f" stroke-width="2.6" marker-end="url(#flem-danger)" />
  <text x="428" y="290" text-anchor="end" font-size="10.5" fill="#5f646b">中指</text>
  <text x="428" y="306" text-anchor="end" font-size="12.5" font-weight="700" fill="#9c433f">e（起電力）</text>
  <text x="428" y="322" text-anchor="end" font-size="10" fill="#5f646b">紙面の手前へ</text>

  <text x="524" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#151b24">フレミングの右手の法則</text>
</svg>
